<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Last Day</title>
<meta name="description" content="Know what your company forgets before someone leaves.">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&family=JetBrains+Mono:wght@400&display=swap">
<link rel="stylesheet" href="/static/styles.css?v=2">
</head>
<body>
<a class="skip" href="#main">Skip to the investigation</a>
<div class="app">
  <aside class="side" aria-label="People">
    <header class="side-head">
      <h1 class="wordmark">Last Day</h1>
    </header>

    <section aria-labelledby="dep-title">
      <h2 id="dep-title" class="side-title">Leaving</h2>
      <ol class="dep-list" id="dep-list"><li class="side-empty">Loading…</li></ol>
    </section>

    <section class="everyone" aria-labelledby="all-title">
      <h2 id="all-title" class="side-title">Everyone</h2>
      <label class="sr" for="people-search">Find a person</label>
      <input id="people-search" class="side-search" type="search" placeholder="Search" autocomplete="off">
      <ul class="people-list" id="people-list"></ul>
    </section>

    <footer class="side-foot">
      <ul class="status" id="chips" aria-label="Connections"></ul>
      <button class="link" id="open-sources" type="button" aria-haspopup="dialog">Sources</button>
    </footer>
  </aside>

  <main id="main" tabindex="-1">
    <section class="welcome" id="welcome">
      <h2>Who is leaving?</h2>
      <p>Pick a person. The agents read Slack, Jira, GitHub, the wiki and HR, and tell you what leaves with them.</p>
    </section>

    <section class="person" id="person" hidden>
      <div class="person-head">
        <div class="who">
          <h2 id="p-name"></h2>
          <p id="p-role"></p>
        </div>
        <div class="countdown" id="p-countdown" aria-live="polite"></div>
        <div class="person-actions">
          <button class="primary" id="run-btn" type="button">Investigate</button>
          <label class="toggle"><input type="checkbox" id="mem-toggle" checked> Use memory</label>
        </div>
      </div>
      <p class="run-meta" id="run-meta"></p>
      <nav class="tabs" role="tablist" aria-label="Run views" id="tabs">
        <button role="tab" data-tab="trace" aria-selected="true">Trace</button>
        <button role="tab" data-tab="handover">Handover</button>
        <button role="tab" data-tab="interview">Interview</button>
        <button role="tab" data-tab="evidence">Evidence</button>
        <button role="tab" data-tab="ask">Ask</button>
      </nav>
      <div class="panes">
        <section role="tabpanel" data-pane="trace" id="pane-trace"></section>
        <section role="tabpanel" data-pane="handover" id="pane-handover" hidden></section>
        <section role="tabpanel" data-pane="interview" id="pane-interview" hidden></section>
        <section role="tabpanel" data-pane="evidence" id="pane-evidence" hidden></section>
        <section role="tabpanel" data-pane="ask" id="pane-ask" hidden></section>
      </div>
    </section>
  </main>
</div>

<dialog id="sources" aria-labelledby="sources-title">
  <form method="dialog" class="dialog-head">
    <h2 id="sources-title">Sources</h2>
    <button class="ghost" value="close">Close</button>
  </form>
  <div id="sources-body"></div>
</dialog>

<dialog id="drawer" class="drawer" aria-labelledby="drawer-title">
  <form method="dialog" class="dialog-head">
    <h2 id="drawer-title">Evidence</h2>
    <button class="ghost" value="close">Close</button>
  </form>
  <div id="drawer-body"></div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/static/app.js?v=2"></script>
</body>
</html>
